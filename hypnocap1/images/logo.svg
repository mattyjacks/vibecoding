<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <linearGradient id="magicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f0728" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Aura -->
  <circle cx="60" cy="60" r="50" fill="url(#glowGrad)"/>

  <!-- Hypnotic Concentric Swirls -->
  <g transform="translate(60,60)">
    <circle cx="0" cy="0" r="44" stroke="#a855f7" stroke-width="2" stroke-dasharray="8 6" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="34" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="12 4" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="23" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <!-- Center Eye / Diamond -->
    <polygon points="0,-12 12,0 0,12 -12,0" fill="url(#magicGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Sparkles -->
    <polygon points="26,-26 29,-22 34,-24 31,-19 35,-15 30,-14 28,-10 26,-14 21,-15 25,-19 23,-24 27,-22" fill="#ffd700" opacity="0.9"/>
  </g>

  <!-- Brand Typography -->
  <text x="130" y="62" font-family="'Cinzel', 'Trajan Pro', Georgia, serif" font-size="38" font-weight="900" letter-spacing="3" fill="#ffffff">
    HYPNO<tspan fill="url(#magicGrad)">CAP</tspan>
  </text>
  <text x="132" y="86" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#c084fc">
    SALES MAGIC &amp; GLOBAL OUTSOURCING
  </text>
  <circle cx="468" cy="48" r="3" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="482" cy="74" r="2" fill="#f59e0b" filter="url(#glow)"/>
</svg>
