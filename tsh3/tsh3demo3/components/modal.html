<!-- Tri State Honey Modal Specification Viewer Component -->
<div id="tshProductModal" class="tsh-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="tsh-modal-dialog">
    <button type="button" id="tshModalClose" class="tsh-modal-close" aria-label="Close dialog">&times;</button>

    <div style="display: flex; gap: 2rem; align-items: flex-start; flex-wrap: wrap;">
      <div style="width: 150px; height: 170px; background: rgba(6, 8, 13, 0.9); border-radius: var(--tsh-radius-sm); display: flex; align-items: center; justify-content: center; padding: 0.85rem; border: 1px solid rgba(245, 176, 56, 0.35); flex-shrink: 0; box-shadow: 0 0 25px rgba(245, 176, 56, 0.15);">
        <img id="modalImg" src="" alt="Product Package" style="max-height: 145px; max-width: 100%; object-fit: contain;">
      </div>

      <div style="flex: 1; min-width: 260px;">
        <span id="modalCategoryBadge" class="telemetry-badge" style="margin-bottom: 0.65rem;">Packaging Tier</span>
        <h3 id="modalTitle" style="font-family: var(--tsh-font-heading); font-size: 1.85rem; color: #ffffff; margin-bottom: 0.35rem; font-weight: 800;">Product Name</h3>
        <p id="modalSubtitle" style="color: var(--tsh-gold-300); font-family: var(--tsh-font-mono); font-weight: 600; font-size: 0.88rem; margin-bottom: 0.75rem;">Subtitle</p>
        <p id="modalDesc" style="color: var(--tsh-text-secondary); font-size: 0.95rem; line-height: 1.7; font-weight: 300;">Description</p>
      </div>
    </div>

    <div style="margin-top: 2.25rem; border-top: 1px solid var(--tsh-border-dark); padding-top: 1.75rem;">
      <h4 style="font-family: var(--tsh-font-mono); font-size: 0.88rem; color: var(--tsh-gold-300); margin-bottom: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;">Key Advantages &amp; Purity</h4>
      <ul id="modalFeatures" style="list-style: none; font-size: 0.94rem; color: var(--tsh-text-secondary); display: flex; flex-direction: column; gap: 0.65rem; margin-bottom: 2rem; font-weight: 400;">
      </ul>

      <h4 style="font-family: var(--tsh-font-mono); font-size: 0.88rem; color: var(--tsh-gold-300); margin-bottom: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;">Technical Specifications</h4>
      <table class="tsh-modal-table">
        <tbody id="modalSpecs">
        </tbody>
      </table>

      <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
        <a id="modalSampleCta" href="#contact" class="tsh-btn tsh-btn-primary" style="font-size: 0.92rem; padding: 0.85rem 1.75rem;">
          Request Certified Sample For This Tier &rarr;
        </a>
      </div>
    </div>
  </div>
</div>
