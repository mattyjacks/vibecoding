<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- 24K Gold Metallic Gradients -->
    <linearGradient id="goldChitin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd978"/>
      <stop offset="40%" stop-color="#f5b038"/>
      <stop offset="70%" stop-color="#c2841a"/>
      <stop offset="100%" stop-color="#59390a"/>
    </linearGradient>

    <linearGradient id="darkChitin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1f14"/>
      <stop offset="50%" stop-color="#140e08"/>
      <stop offset="100%" stop-color="#080503"/>
    </linearGradient>

    <linearGradient id="amberStripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="45%" stop-color="#f5b038"/>
      <stop offset="100%" stop-color="#c8780c"/>
    </linearGradient>

    <linearGradient id="thoraxFuzz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e59d18"/>
      <stop offset="50%" stop-color="#a06612"/>
      <stop offset="100%" stop-color="#4a2e06"/>
    </linearGradient>

    <!-- Translucent Iridescent Wing Gradient -->
    <linearGradient id="wingSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#fef3c7" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#dbeafe" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Wing Venation Glow -->
    <filter id="honeyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="eyeSpecular" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3d2c1d"/>
      <stop offset="60%" stop-color="#140d07"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
  </defs>

  <!-- Ambient Golden Aura Glow -->
  <circle cx="80" cy="80" r="70" fill="url(#goldChitin)" opacity="0.12" filter="url(#honeyGlow)"/>

  <!-- G: LEGS (6 Jointed Chitinous Legs) -->
  <g stroke="url(#darkChitin)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Front Legs -->
    <path d="M68 62 L48 48 L36 54"/>
    <path d="M92 62 L112 48 L124 54"/>
    <!-- Middle Legs -->
    <path d="M65 78 L42 80 L32 94"/>
    <path d="M95 78 L118 80 L128 94"/>
    <!-- Hind Legs with Corbicula (Pollen Basket) -->
    <path d="M68 94 L46 112 L40 134"/>
    <path d="M92 94 L114 112 L120 134"/>
  </g>

  <!-- Pollen Baskets (Corbiculae on hind tibiae) -->
  <ellipse cx="44" cy="116" rx="5" ry="9" transform="rotate(-25 44 116)" fill="#f5b038" stroke="#d97706" stroke-width="1"/>
  <ellipse cx="116" cy="116" rx="5" ry="9" transform="rotate(25 116 116)" fill="#f5b038" stroke="#d97706" stroke-width="1"/>

  <!-- HINDWINGS (Semi-translucent with venation) -->
  <g opacity="0.82">
    <!-- Left Hindwing -->
    <path d="M72 75 C45 68, 22 85, 34 104 C44 112, 65 95, 74 80 Z" fill="url(#wingSheen)" stroke="#926218" stroke-width="1"/>
    <path d="M72 76 C55 78, 38 88, 34 104" stroke="#78480d" stroke-width="0.8" fill="none"/>
    <path d="M52 82 L42 98" stroke="#78480d" stroke-width="0.6" fill="none"/>

    <!-- Right Hindwing -->
    <path d="M88 75 C115 68, 138 85, 126 104 C116 112, 95 95, 86 80 Z" fill="url(#wingSheen)" stroke="#926218" stroke-width="1"/>
    <path d="M88 76 C105 78, 122 88, 126 104" stroke="#78480d" stroke-width="0.8" fill="none"/>
    <path d="M108 82 L118 98" stroke="#78480d" stroke-width="0.6" fill="none"/>
  </g>

  <!-- ABDOMEN (Metasoma - Striped Overlapping Chitin Tergites) -->
  <g>
    <!-- Tergite 1 (Golden base) -->
    <path d="M66 84 C66 82, 94 82, 94 84 L96 93 C96 95, 64 95, 64 93 Z" fill="url(#amberStripe)" stroke="#1a1208" stroke-width="1.2"/>
    <!-- Tergite 2 (Dark band) -->
    <path d="M64 92 C64 92, 96 92, 96 92 L97 101 C97 103, 63 103, 63 101 Z" fill="url(#darkChitin)" stroke="#000" stroke-width="1"/>
    <!-- Tergite 3 (Golden amber band) -->
    <path d="M63 100 C63 100, 97 100, 97 100 L96 110 C96 112, 64 112, 64 110 Z" fill="url(#amberStripe)" stroke="#1a1208" stroke-width="1.2"/>
    <!-- Tergite 4 (Dark band) -->
    <path d="M64 109 C64 109, 96 109, 96 109 L94 119 C94 121, 66 121, 66 119 Z" fill="url(#darkChitin)" stroke="#000" stroke-width="1"/>
    <!-- Tergite 5 (Golden stripe) -->
    <path d="M66 118 C66 118, 94 118, 94 118 L90 128 C90 130, 70 130, 70 128 Z" fill="url(#amberStripe)" stroke="#1a1208" stroke-width="1.2"/>
    <!-- Tergite 6 & Sting Chamber (Dark tapered tip) -->
    <path d="M70 127 C70 127, 90 127, 90 127 L82 142 C81 144, 79 144, 78 142 Z" fill="url(#darkChitin)" stroke="#000" stroke-width="1"/>
    <!-- Stinger -->
    <path d="M80 142 L80 148" stroke="#161009" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- FOREWINGS (Long, Translucent, Detailed Venation) -->
  <g opacity="0.9">
    <!-- Left Forewing -->
    <path d="M74 68 C45 32, 10 38, 14 62 C16 78, 48 84, 74 72 Z" fill="url(#wingSheen)" stroke="#8e5d12" stroke-width="1.4"/>
    <!-- Wing Venation: Marginal & Submarginal Veins -->
    <path d="M74 68 C42 42, 22 45, 14 62" stroke="#683d08" stroke-width="1.8" fill="none"/>
    <path d="M28 50 C38 58, 52 64, 74 70" stroke="#78480d" stroke-width="1.0" fill="none"/>
    <path d="M38 56 L46 68" stroke="#78480d" stroke-width="0.8" fill="none"/>
    <path d="M48 52 L56 66" stroke="#78480d" stroke-width="0.8" fill="none"/>
    <!-- Pterostigma (Dark wing cell on leading edge) -->
    <path d="M25 47 Q28 46 32 49 Q29 51 25 47" fill="#683d08"/>

    <!-- Right Forewing -->
    <path d="M86 68 C115 32, 150 38, 146 62 C144 78, 112 84, 86 72 Z" fill="url(#wingSheen)" stroke="#8e5d12" stroke-width="1.4"/>
    <!-- Wing Venation -->
    <path d="M86 68 C118 42, 138 45, 146 62" stroke="#683d08" stroke-width="1.8" fill="none"/>
    <path d="M132 50 C122 58, 108 64, 86 70" stroke="#78480d" stroke-width="1.0" fill="none"/>
    <path d="M122 56 L114 68" stroke="#78480d" stroke-width="0.8" fill="none"/>
    <path d="M112 52 L104 66" stroke="#78480d" stroke-width="0.8" fill="none"/>
    <!-- Pterostigma -->
    <path d="M135 47 Q132 46 128 49 Q131 51 135 47" fill="#683d08"/>
  </g>

  <!-- THORAX (Mesosoma - Velvet Golden Fur Setae) -->
  <g>
    <!-- Base Thorax -->
    <ellipse cx="80" cy="70" rx="17" ry="19" fill="url(#thoraxFuzz)" stroke="#261806" stroke-width="1.5"/>
    <!-- Dense Fur Strands Simulation -->
    <ellipse cx="80" cy="70" rx="14" ry="16" fill="url(#goldChitin)" opacity="0.75"/>
    <path d="M72 58 Q80 54 88 58 Q80 62 72 58" fill="#ffe082" opacity="0.8"/>
    <path d="M70 68 Q80 64 90 68 Q80 72 70 68" fill="#ffe082" opacity="0.6"/>
    <path d="M72 78 Q80 75 88 78 Q80 82 72 78" fill="#ffe082" opacity="0.7"/>
  </g>

  <!-- HEAD & COMPOUND EYES -->
  <g>
    <!-- Head Base -->
    <ellipse cx="80" cy="49" rx="13" ry="10" fill="url(#darkChitin)" stroke="#000" stroke-width="1.2"/>
    <ellipse cx="80" cy="47" rx="8" ry="4" fill="#684210" opacity="0.7"/>

    <!-- Left Compound Eye (Faceted Kidney Shape) -->
    <ellipse cx="69" cy="48" rx="5.5" ry="9" transform="rotate(-18 69 48)" fill="url(#eyeSpecular)" stroke="#0a0704" stroke-width="1"/>
    <!-- Specular Highlight on Eye -->
    <ellipse cx="68" cy="45" rx="1.8" ry="3.5" transform="rotate(-18 68 45)" fill="#ffffff" opacity="0.55"/>

    <!-- Right Compound Eye -->
    <ellipse cx="91" cy="48" rx="5.5" ry="9" transform="rotate(18 91 48)" fill="url(#eyeSpecular)" stroke="#0a0704" stroke-width="1"/>
    <!-- Specular Highlight on Eye -->
    <ellipse cx="92" cy="45" rx="1.8" ry="3.5" transform="rotate(18 92 45)" fill="#ffffff" opacity="0.55"/>

    <!-- Ocelli (3 simple eyes on vertex) -->
    <circle cx="80" cy="42" r="1.1" fill="#ffd54f"/>
    <circle cx="77.5" cy="43.5" r="0.9" fill="#ffd54f"/>
    <circle cx="82.5" cy="43.5" r="0.9" fill="#ffd54f"/>

    <!-- Antennae (Elbowed Scape & Flagellum) -->
    <path d="M76 43 C72 34, 62 26, 52 28" stroke="#1a1208" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M84 43 C88 34, 98 26, 108 28" stroke="#1a1208" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Clypeus & Mandibles -->
    <path d="M76 56 L80 60 L84 56" stroke="#3d260c" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
